<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace employés SONABHY</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5d5b55;
      --line: #d9d5ca;
      --green: #1b8a3d;
      --green-dark: #146b2e;
      --red: #d62828;
      --yellow: #f4b400;
      --blue: #cfe6f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    .flag {
      height: 8px;
      background: linear-gradient(90deg, #d62828 0 33.33%, #f4b400 33.33% 66.66%, #1b8a3d 66.66% 100%);
    }

    header {
      display: flex;
      align-items: center;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .logo-mark {
      width: 14px;
      height: 34px;
      border-radius: 2px;
      overflow: hidden;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
    }

    .logo-mark i:nth-child(1) { background: #d62828; }
    .logo-mark i:nth-child(2) { background: #f4b400; }
    .logo-mark i:nth-child(3) { background: #1b8a3d; }

    .sub {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 24px;
    }

    .hero {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), #cdd3c4);
      color: #333c45;
      font-weight: 700;
      text-align: center;
    }

    .panel {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover { background: var(--green-dark); }

    .error {
      min-height: 1.4em;
      margin: 10px 0 0;
      color: var(--red);
      font-weight: 700;
    }

    footer {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="flag"></div>

  <header>
    <div class="logo" aria-label="SONABHY">
      <div class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <span>SONABHY</span>
    </div>
    <span class="sub">Espace employés</span>
  </header>

  <main>
    <div class="hero">Bienvenue dans l’espace employé</div>

    <section class="panel">
      <h1>Accès à l'espace</h1>
      <p>Saisissez le code employé que vous avez reçu par e-mail.</p>

      <form id="form" autocomplete="off">
        <label for="code">Code employé</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Code" required>
        <p class="error" id="err" role="alert"></p>
        <button type="submit">Entrer</button>
      </form>
    </section>
  </main>

  <footer>SONABHY — Espace employés</footer>

  <script>
    const CODE_VALIDE = "4021";
    const form = document.getElementById("form");
    const input = document.getElementById("code");
    const error = document.getElementById("err");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (input.value.trim() === CODE_VALIDE) {
        window.location.href = "bienvenue.html";
      } else {
        error.textContent = "Code incorrect. Vérifiez le code reçu par e-mail.";
        input.select();
      }
    });
  </script>
</body>
</html>
