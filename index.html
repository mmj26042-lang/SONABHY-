<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès SONABHY</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5d5b55;
      --line: #d9d5ca;
      --green: #1b8a3d;
      --green-dark: #146b2e;
      --red: #d62828;
      --yellow: #f4b400;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--green);
      font-size: clamp(1.8rem, 2vw, 2.4rem);
    }

    p {
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.08em;
    }

    input:focus {
      outline: 3px solid rgba(244, 180, 0, 0.45);
      border-color: var(--yellow);
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--green-dark);
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      font-weight: 700;
      color: var(--red);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>SONABHY</h1>
    <p>Veuillez saisir votre code employé.</p>

    <form id="formulaire" novalidate>
      <input type="text" id="code" placeholder="Entrez votre code" maxlength="10" autocomplete="off" />
      <button type="submit">Valider</button>
    </form>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <script>
    const codeValide = "4821";

    document.getElementById("formulaire").addEventListener("submit", function (event) {
      event.preventDefault();

      const codeSaisi = document.getElementById("code").value.trim();
      const message = document.getElementById("message");

      if (codeSaisi === codeValide) {
        window.location.href = "bienvenue.html";
      } else {
        message.textContent = "Code incorrect. Veuillez réessayer.";
        document.getElementById("code").focus();
      }
    });
  </script>
</body>
</html>
