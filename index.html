<div style="text-align:center; margin-top:50px;">
  <input type="text" id="codeInput" placeholder="Entrez votre code" style="padding:8px; font-size:16px;">
  <button onclick="verifierCode()" style="padding:8px 16px; font-size:16px;">Valider</button>
  <p id="resultat" style="margin-top:20px; font-size:18px;"></p>
</div>

<script>
  const codes = {
    "4821": {
      nom: "Mme TAMINI",
      date: "24 Septembre",
      message: "Rendez-vous le 24 Septembre muni de ce code."
    }
    // Vous pourrez ajouter d'autres personnes ici, ex :
    // "1234": { nom: "M. DUPONT", date: "25 Septembre", message: "..." }
  };

  function verifierCode() {
    const saisi = document.getElementById("codeInput").value.trim();
    const resultat = document.getElementById("resultat");
    if (codes[saisi]) {
      resultat.textContent = "Bienvenue " + codes[saisi].nom + ". " + codes[saisi].message;
    } else {
      resultat.textContent = "Code incorrect.";
    }
  }
</script>

<html lang="fr">

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f6f4ef;
  --surface: #ffffff;
  --text: #1d1d1b;
  --muted: #5d5b55;
  --line: #d9d5ca;
  --red: #d62828;
  --yellow: #f4b400;
  --green: #1b8a3d;
  --sky: #cfe6f2;
  --ground: #cdd3c4;
  --plant: #4a5560;
  --plant-dark: #333c45;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14150f; --surface: #1e201a; --text: #f1efe8; --muted: #a9a698; --line: #38382f;
    --sky: #1f3140; --ground: #2b3025; --plant: #7a8794; --plant-dark: #5b6671;
  }
}
:root[data-theme="dark"] {
  --bg: #14150f; --surface: #1e201a; --text: #f1efe8; --muted: #a9a698; --line: #38382f;
  --sky: #1f3140; --ground: #2b3025; --plant: #7a8794; --plant-dark: #5b6671;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  line-height: 1.5; display: flex; flex-direction: column;
}
.flag { height: 8px; background: linear-gradient(90deg, var(--red) 0 33.33%, var(--yellow) 33.33% 66.66%, var(--green) 66.66% 100%); }
header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; max-width: 720px; width: 100%; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 10px; }\n.logo-image { display: block; width: 150px; height: 92px; object-fit: contain; }
.logo-mark { display: grid; grid-template-rows: repeat(3, 1fr); width: 14px; height: 34px; border-radius: 2px; overflow: hidden; }
.logo-mark i:nth-child(1) { background: var(--red); }
.logo-mark i:nth-child(2) { background: var(--yellow); }
.logo-mark i:nth-child(3) { background: var(--green); }
.logo-word { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.06em; }
.sub { color: var(--muted); font-size: 0.95rem; margin-left: auto; }
main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px 24px; }
.hero { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.hero img { display: block; width: 100%; height: auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-top: 18px; }
h1 { font-size: 1.5rem; margin: 0 0 6px; line-height: 1.25; }
p { margin: 0 0 14px; color: var(--muted); }
label { display: block; font-weight: 700; margin-bottom: 6px; }
input {
  width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 8px;
  border: 2px solid var(--line); background: var(--bg); color: var(--text); letter-spacing: 0.12em;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
button {
  font: inherit; font-weight: 700; cursor: pointer; margin-top: 14px; width: 100%;
  padding: 13px; border: 0; border-radius: 8px; background: var(--green); color: #fff;
}
button.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); }
.error { color: var(--red); font-weight: 700; min-height: 1.4em; margin: 10px 0 0; }
.welcome-line { font-size: 1.15rem; color: var(--text); margin: 0; }
.date { display: inline-block; margin-top: 14px; padding: 10px 14px; border-left: 6px solid var(--yellow); background: var(--bg); font-weight: 700; }
.hidden { display: none; }
footer { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 20px 20px; font-size: 0.8rem; color: var(--muted); }
.employee-footer { padding: 0; margin-top: 12px; }
.employee-footer img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
</style>
</head>

<script>
  // Le code est partagé avec l’application Mail via localStorage.
  // Aucun code fixe n’est enregistré dans cette page.
  var AUTH_KEY = "sonabhy-code-v1";

  var form = document.getElementById("form");
  var input = document.getElementById("code");
  var err = document.getElementById("err");
  var login = document.getElementById("login");
  var welcome = document.getElementById("welcome");

  function getStoredCode(){
    try {
      var raw = localStorage.getItem(AUTH_KEY);
      if (!raw) return "";
      var data = JSON.parse(raw);
      if (!data || !data.code) return "";
      return String(data.code).toUpperCase();
    } catch(e) { return ""; }
  }

  function fillCode(){
    var code = getStoredCode();
    if (code) {
      input.value = code;
      err.textContent = "";
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var saisi = input.value.trim().toUpperCase();
    var code = getStoredCode();
    if (code && saisi === code) {
      err.textContent = "";
      login.classList.add("hidden");
      welcome.classList.remove("hidden");
    } else {
      err.textContent = "Code incorrect. Vérifiez le code reçu par e-mail.";
      input.select();
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    welcome.classList.add("hidden");
    login.classList.remove("hidden");
    fillCode();
    input.focus();
  });

  // Dès que l’application Mail enregistre un nouveau code, le champ est mis à jour.
  window.addEventListener("storage", function(e){
    if (e.key === AUTH_KEY) fillCode();
  });

  try {
    var c = new URLSearchParams(location.search).get("code");
    if (c) input.value = c.toUpperCase();
    else fillCode();
  } catch (x) { fillCode(); }
</script>
