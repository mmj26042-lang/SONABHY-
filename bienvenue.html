<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue SONABHY</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5d5b55;
      --line: #d9d5ca;
      --green: #1b8a3d;
      --yellow: #f4b400;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 40px 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--green);
      font-size: clamp(1.8rem, 2vw, 2.6rem);
    }

    p {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      line-height: 1.6;
      color: var(--text);
    }

    .date-box {
      display: inline-block;
      margin-top: 22px;
      background: var(--yellow);
      color: #000;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Bienvenue, Mme TAMINI Annita R. H. !</h1>
    <p>Rendez-vous le 24 septembre, munie de ce code.</p>
    <div class="date-box">24 septembre</div>
  </main>
</body>
</html>
